<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teckno Salary Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0e1626">
<meta name="mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#e9edf3; --panel:#fff; --panelAlt:#f5f7fb; --ink:#0e1626; --sub:#647184; --faint:#97a2b3;
  --line:#e4e9f0; --primary:#0c7d71; --primarySoft:#d4ece9; --blue:#2563eb; --blueSoft:#e3ecfd;
  --green:#0e9d6a; --greenSoft:#dbf2e8; --red:#df3f66; --redSoft:#fbe1e9; --chip:#eef2f7;
  --header:#0e1626; --headerSub:#8b97a8; --teal:#2dd4bf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;padding-bottom:50px}
button{touch-action:manipulation}
.disp{font-family:'Bricolage Grotesque',Georgia,serif}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#c4cdd9;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 14px}
.hdr{background:var(--header);color:#fff;padding:20px 16px 0;border-bottom:3px solid var(--primary);flex-shrink:0}
.hdrin{max-width:1040px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.htitle{font-weight:800;font-size:21px;letter-spacing:-.6px;line-height:1.05}
.hsub{font-size:12px;color:var(--headerSub);margin-top:2px}
.hbtn{height:38px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:7px}
.tabs{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}
.tab{background:transparent;color:var(--headerSub);border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--teal)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--panel);border-radius:18px;padding:16px 18px;flex:1;min-width:150px;box-shadow:0 2px 8px rgba(14,22,38,.07);position:relative;overflow:hidden}
.stat .bar{position:absolute;top:0;left:0;width:4px;height:100%}
.stat .lbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:7px}
.stat .dot{width:8px;height:8px;border-radius:8px;display:inline-block}
.stat .val{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
.stat .sub{font-size:12px;color:var(--sub);margin-top:3px}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-top:20px;box-shadow:0 2px 8px rgba(14,22,38,.07)}
.ctitle{font-weight:700;font-size:16.5px;letter-spacing:-.3px;margin-bottom:12px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.trow{display:flex;align-items:center;padding:11px 6px;border-top:1px solid var(--line);border-radius:8px;transition:background .15s}
.trow:hover{background:var(--panelAlt)}
.chipbtn{background:var(--panel);color:var(--sub);border:1px solid var(--line);padding:8px 13px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input.search,select.sel{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:13.5px;font-family:inherit;outline:none;color:var(--ink)}
.scard{background:var(--panel);border-radius:16px;margin-bottom:11px;overflow:hidden;box-shadow:0 2px 8px rgba(14,22,38,.07)}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.sdet{border-top:1px solid var(--line);padding:16px;background:var(--panelAlt)}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:104px}
.mini .k{font-size:10px;text-transform:uppercase;color:var(--sub);font-weight:700;letter-spacing:.6px}
.mini .v{font-size:16.5px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 22px;font-size:13px}
.lrow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lbar{width:6px;height:28px;border-radius:6px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(14,22,38,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:20px;padding:24px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(14,22,38,.4)}
.mtitle{font-weight:800;font-size:20px;letter-spacing:-.4px}
.xbtn{margin-left:auto;background:none;border:none;font-size:24px;color:var(--faint);cursor:pointer;line-height:1}
.pinbox{width:100%;padding:13px;text-align:center;letter-spacing:2px;font-size:16px;border:1px solid var(--line);border-radius:12px;outline:none;font-family:inherit}
.savebtn{width:100%;margin-top:16px;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.mtable{min-width:640px}
.mth{display:flex;padding:12px 14px;border-bottom:2px solid var(--line);font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.6px}
.mtr{display:flex;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.mcell{width:100px;text-align:right}
.note{font-size:12.5px;color:var(--sub)}
.footer{text-align:center;font-size:11.5px;color:var(--faint);margin-top:28px;line-height:1.6}
@media (max-width:640px){ .stat .val{font-size:20px} .mcell{width:92px} }
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let DATA=null;
let ENC=null;
let PASS=null;
let LASTSYNC=null;
const BHUP_PIN="2611", MASK="••••••", BHUP_ID="FEBM303";
const VERSION="v10.1";
const DATA_AS_OF = "12 Aug 2026";
const asOfStr=()=>DATA&&DATA.asOf?fdate(DATA.asOf):DATA_AS_OF;

const S={unlocked:false,tab:'dashboard',q:'',typeF:'All',statusF:'Active',openEmp:null,
lEmp:'All',lMonth:'All',lType:'All',pSearch:'',pFrom:'',pTo:'',stmtEmp:null,
bhup:false,monthDetail:null,modal:null,pinErr:false};

const esc=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inr=n=>{if(n==null||isNaN(n))return'₹0';const neg=n<0,v=Math.abs(Math.round(n));return(neg?'-₹':'₹')+v.toLocaleString('en-IN')};
const fdate=d=>{if(!d)return'—';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
const mlabel=mk=>{if(!mk)return mk;const[y,m]=mk.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y};
const hideB=id=>id===BHUP_ID&&!S.bhup;

function empStats(e){let a=0,p=0;DATA.ledger.forEach(t=>{if(t.empId!==e.id)return;const amt=Math.abs(+t.amount||0);t.direction==='-'?p+=amt:a+=amt});const o=+e.opening||0;return{acc:a,paid:p,open:o,bal:o+a-p,count:DATA.ledger.filter(t=>t.empId===e.id).length}}
let STATS={};

function rollup(){const m={};DATA.ledger.forEach(t=>{const k=t.month||t.date.slice(0,7);m[k]=m[k]||{mk:k,acc:0,paid:0,n:0};const amt=Math.abs(+t.amount||0);t.direction==='-'?m[k].paid+=amt:m[k].acc+=amt;m[k].n++});
let run=DATA.employees.reduce((s,e)=>s+(+e.opening||0),0);
return Object.values(m).sort((a,b)=>a.mk.localeCompare(b.mk)).map(r=>{r.open=run;r.close=run+r.acc-r.paid;run=r.close;return r})}
let MONTHLY=[];
let MONTHS=[];
function initData(d){DATA=d;STATS={};d.employees.forEach(e=>STATS[e.id]=empStats(e));MONTHLY=rollup();MONTHS=[...new Set(d.ledger.map(t=>t.month).filter(Boolean))].sort().reverse();}
async function decryptObj(pass,e){
 const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct));
 let bytes=new Uint8Array(pt);
 if(e.c==='gzip'){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));bytes=new Uint8Array(await new Response(st).arrayBuffer());}
 return JSON.parse(new TextDecoder().decode(bytes));
}
async function decryptData(pass){
 if(!ENC){const r=await fetch('data.enc.json',{cache:'no-store'});if(!r.ok)throw new Error('fetch');ENC=await r.json();}
 return decryptObj(pass,ENC);
}
/* ---------- live sync ---------- */
let SYNCING=false;
function toast(msg,err){const t=document.createElement('div');t.textContent=msg;
t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:'+(err?'#df3f66':'#0e1626')+';color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:99;box-shadow:0 10px 30px rgba(14,22,38,.35);opacity:0;transition:opacity .25s';
document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity='1');
setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2600)}
async function checkUpdate(manual){
 if(!S.unlocked||!PASS||SYNCING)return;
 SYNCING=true;const ic=document.getElementById('syncIcon');if(ic)ic.style.animation='spin 1s linear infinite';
 try{
  const r=await fetch('data.enc.json',{cache:'no-store'});if(!r.ok)throw new Error('fetch');
  const j=await r.json();
  if(!ENC||j.ct!==ENC.ct){
   const d=await decryptObj(PASS,j);
   ENC=j;initData(d);LASTSYNC=new Date();render();toast('✓ Naya data aa gaya');
  }else{LASTSYNC=new Date();if(manual)toast('Data already latest hai');else{const el=document.getElementById('synct');if(el)el.textContent=syncLabel()}}
 }catch(e){if(manual)toast('Update check fail hua — net check karo',true)}
 SYNCING=false;const ic2=document.getElementById('syncIcon');if(ic2)ic2.style.animation='';
}
const syncLabel=()=>LASTSYNC?'sync '+LASTSYNC.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
/* ---------- brand logo (manifest se) ---------- */
let LOGO=null;
fetch('manifest.json').then(r=>r.json()).then(m=>{
 const ic=(m.icons||[]).find(i=>(i.src||'').startsWith('data:'));
 if(!ic)return;LOGO=ic.src;
 ['icon','apple-touch-icon'].forEach(rel=>{let l=document.querySelector(`link[rel="${rel}"]`);if(l)l.href=LOGO});
 document.querySelectorAll('.applogo').forEach(el=>{el.innerHTML=`<img src="${LOGO}" alt="logo" style="width:100%;height:100%;object-fit:cover;display:block">`});
}).catch(()=>{});
const logoBox=()=>LOGO?`<img src="${LOGO}" alt="logo" style="width:100%;height:100%;object-fit:cover;display:block">`:'T';
/* ---------- Smart Assistant (sab offline — data bahar nahi jata) ---------- */
let ASKLOG=[];
const MONTHW={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
function qNorm(s){return ' '+s.toLowerCase().replace(/[?.,!₹"']/g,' ').replace(/\s+/g,' ').trim()+' '}
function qEmp(q){let best=null;DATA.employees.forEach(e=>{const parts=e.name.toLowerCase().split(' ').filter(w=>w.length>=3);parts.push(e.id.toLowerCase());parts.forEach(p=>{if(q.includes(' '+p+' ')||q.includes(' '+p.slice(0,Math.max(4,p.length-1))+' ')){if(!best||p.length>best.len)best={e,len:p.length}}})});return best?best.e:null}
function qMonth(q){for(const w in MONTHW){if(q.includes(' '+w+' '))return '2026-'+String(MONTHW[w]).padStart(2,'0')}
if(/ (is|this) month /.test(q)){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
if(/ (pichhle|pichle|last) month /.test(q)){const d=new Date();d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
return null}
const has=(q,words)=>words.some(w=>q.includes(' '+w+' '));
function ansCard(t){return `<div style="background:var(--panelAlt);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.65">${t}</div>`}
function lockAns(){return ansCard('🔒 Bhupendra ka data private hai — header ke <b>Bhupendra</b> button se PIN daal ke unlock karo, phir poochho.')}
function answerQuery(raw){
const q=qNorm(raw);
if(has(q,['help','madad','kya pooch','kya puch','examples']))return ansCard('Aise poochho: <b>Jitendra ka balance</b> · <b>July me kitna paid hua</b> · <b>total kitna dena hai</b> · <b>is month kitna cash chahiye</b> · <b>Priyanka kab settle hogi</b> · <b>kiska advance hai</b> · <b>Harshit ko July me kitna diya</b>');
const emp=qEmp(q), mk=qMonth(q);
const wantPaid=has(q,['paid','diya','diye','payment','mila','pay']),wantAcc=has(q,['accrued','bana','bani','cost','kharcha','kharch']),wantBal=has(q,['balance','baki','baaki','due','dena','bacha']),wantSal=has(q,['salary','tankha']);
/* "X se kitna aaya" — us bande se aaya funding */
if(emp&&(DATA.funding||[]).some(f=>f.fromId===emp.id)&&(has(q,['aaya','aaye','aya','mila','mile','received','se'])||(has(q,['ne'])&&has(q,['diya','diye','de'])))&&!has(q,['ko','balance','due','dena','salary'])){
 const fs=(DATA.funding||[]).filter(f=>f.fromId===emp.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const tot=fs.reduce((s,f)=>s+(+f.amount||0),0);
 return ansCard(`<b>${esc(emp.name)} se aaya cash: ${inr(tot)}</b><br>`+fs.map(f=>`• ${fdate(f.date)}: ${inr(f.amount)}${f.method?' ('+esc(f.method)+')':''}`).join('<br>')+`<br><span style="color:var(--sub)">Company funding — kisi ke balance me nahi jata.</span>`)}
/* person + month */
if(emp&&mk){if(hideB(emp.id))return lockAns();
 let p=0,a=0;DATA.ledger.forEach(t=>{if(t.empId===emp.id&&t.month===mk){t.direction==='-'?p+=Math.abs(t.amount):a+=Math.abs(t.amount)}});
 return ansCard(`<b>${esc(emp.name)} — ${mlabel(mk)}</b><br>Paid (diya): <b style="color:var(--primary)">${inr(p)}</b> · Accrued (bana): <b style="color:var(--blue)">${inr(a)}</b>`)}
/* person */
if(emp){if(hideB(emp.id))return lockAns();
 const s=STATS[emp.id];
 if(wantSal&&emp.baseSalary)return ansCard(`<b>${esc(emp.name)}</b> ki salary: <b>${inr(emp.baseSalary)}/month</b> (${emp.type})`);
 if(has(q,['phone','number','contact']))return ansCard(`<b>${esc(emp.name)}</b>: ${esc(emp.phone||'—')}`);
 if(has(q,['bank','account','ifsc','khata']))return ansCard(`<b>${esc(emp.name)}</b><br>Bank: ${esc(emp.bankName||'—')} · A/C: ${esc(emp.accountNumber||'—')} · IFSC: ${esc(emp.ifsc||'—')}`);
 if(has(q,['settle','settlement','kab tak'])&&s.bal>0){const m=Math.ceil(s.bal/18000);return ansCard(`<b>${esc(emp.name)}</b> ka due ${inr(s.bal)} hai — ₹18,000/month ke hisaab se <b>~${m} month</b> lagenge.`)}
 if(wantPaid&&!wantBal){const last=DATA.ledger.filter(t=>t.empId===emp.id&&t.direction==='-').sort((x,y)=>(y.date||'').localeCompare(x.date||''))[0];
  return ansCard(`<b>${esc(emp.name)}</b> ko ab tak total <b style="color:var(--primary)">${inr(s.paid)}</b> diya gaya hai.${last?` Aakhri payment: ${inr(last.amount)} (${fdate(last.date)})`:''}`)}
 if(wantAcc&&!wantBal)return ansCard(`<b>${esc(emp.name)}</b> ka ab tak total accrued (bana): <b style="color:var(--blue)">${inr(s.acc)}</b>`);
 const st=Math.round(s.bal)===0?'<b style="color:var(--green)">Settled ✓</b>':s.bal>0?`<b style="color:var(--red)">Due ${inr(s.bal)}</b> (company ko dena hai)`:`<b style="color:var(--green)">Advance ${inr(-s.bal)}</b> (usne zyada le rakha hai)`;
 return ansCard(`<b>${esc(emp.name)}</b> (${emp.id} · ${emp.type}${emp.status==='Inactive'?' · Inactive':''})<br>Opening ${inr(s.open)} + Accrued ${inr(s.acc)} − Paid ${inr(s.paid)}<br>Status: ${st}`)}
/* funding — "kitna cash aaya" (cash/upcoming se PEHLE, warna wo pakad leta hai) */
if(has(q,['funding','fund'])||(has(q,['aaya','aaye','aya','mila','mile','received'])&&has(q,['cash','paisa','paise','kitna','kitne','rupay','total']))){
 const fs=DATA.funding||[];if(!fs.length)return ansCard('Abhi tak koi funding (aaya hua cash) record nahi hai.');
 return ansCard(`<b>Cash aaya (company funding): ${inr(fundTotal())}</b><br>`+fs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(f=>`• ${fdate(f.date)} — ${esc(f.from)}: ${inr(f.amount)}`).join('<br>')+`<br><span style="color:var(--sub)">Ye kisi ke balance/due me nahi jata.</span>`)}
/* cash / upcoming (month se pehle — "is month kitna cash" jaise sawaal) */
if(has(q,['cash','lagega','chahiye','upcoming','aane'])){const up=DATA.upcoming||[];const cash=up.filter(u=>u.cash).reduce((s,u)=>s+(+u.amount||0),0);
 const rows=up.map(u=>hideB(u.empId)?`• ${esc(u.empName)}: 🔒`:`• ${esc(u.empName)}: ${inr(u.amount)}${u.cash?'':' (no cash)'}`).join('<br>');
 return ansCard(`<b>Cash ready rakhna: ${inr(cash)}</b><br>${rows||'Koi upcoming payment nahi.'}`)}
/* month only */
if(mk){const m=MONTHLY.find(x=>x.mk===mk);if(!m)return ansCard(`${mlabel(mk)} ka koi record nahi hai.`);
 return ansCard(`<b>${mlabel(mk)}</b><br>Accrued: <b style="color:var(--blue)">${inr(m.acc)}</b> · Paid: <b style="color:var(--primary)">${inr(m.paid)}</b><br>Closing balance: <b>${inr(m.close)}</b> (${m.n} transactions)`)}
/* advance */
if(has(q,['advance'])){const adv=DATA.employees.filter(e=>Math.round(STATS[e.id].bal)<0);
 if(!adv.length)return ansCard('Kisi ka advance nahi hai.');
 return ansCard('<b>Advance (zyada liya hua):</b><br>'+adv.map(e=>hideB(e.id)?`• ${esc(e.name)}: 🔒`:`• ${esc(e.name)}: ${inr(-STATS[e.id].bal)}`).join('<br>'))}
/* dues / totals */
if(has(q,['total','net','sab','kitna dena','kiska due','dues','sabse'])||wantBal){
 let net=0;DATA.employees.forEach(e=>net+=STATS[e.id].bal);
 const dues=DATA.employees.filter(e=>Math.round(STATS[e.id].bal)>0).sort((a,b)=>STATS[b.id].bal-STATS[a.id].bal);
 return ansCard(`<b>Net company due: ${inr(net)}</b><br>`+dues.map(e=>hideB(e.id)?`• ${esc(e.name)}: 🔒 hidden`:`• ${esc(e.name)}: ${inr(STATS[e.id].bal)}`).join('<br>'))}
if(wantPaid){let p=0;DATA.ledger.forEach(t=>{if(t.direction==='-')p+=Math.abs(t.amount)});return ansCard(`Ab tak total paid (YTD): <b style="color:var(--primary)">${inr(p)}</b>`)}
if(has(q,['staff','kitne log','employees'])){const act=DATA.employees.filter(e=>e.status==='Active');return ansCard(`Staff: <b>${DATA.employees.length}</b> total · <b>${act.length}</b> active (Fixed ${act.filter(e=>e.type==='Fixed').length} · Freelance ${act.filter(e=>e.type==='Freelance').length})`)}
return ansCard(`Ye samajh nahi aaya. Simple poochho — jaise <b>"Jitendra ka balance"</b> ya <b>"July me kitna paid"</b>. Complex sawaal ke liye Claude ko chat mein bolo — wo poora analysis karke dega.`)}
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});

function balTag(b){if(Math.round(b)===0)return `<span class="badge" style="color:var(--sub);background:var(--chip)">Settled</span>`;
if(b>0)return `<span class="badge" style="color:var(--red);background:var(--redSoft)">Due ${inr(b)}</span>`;
return `<span class="badge" style="color:var(--green);background:var(--greenSoft)">Advance ${inr(-b)}</span>`}
const lockBadge=`<span class="badge" style="color:var(--sub);background:var(--chip)">🔒 hidden</span>`;

/* ---------- inactivity timers (throttled — scroll jank na ho) ---------- */
let lockT,bhupT,lastAct=0;
function armTimers(){clearTimeout(lockT);clearTimeout(bhupT);
if(S.unlocked)lockT=setTimeout(()=>{S.unlocked=false;S.bhup=false;S.modal=null;PASS=null;render()},300000);
if(S.bhup)bhupT=setTimeout(()=>{S.bhup=false;if(S.modal==='bhupnote')S.modal=null;render()},30000)}
function activity(){const n=performance.now();if(n-lastAct>1500){lastAct=n;armTimers()}}
['mousedown','keydown','touchstart','click'].forEach(ev=>window.addEventListener(ev,activity,{passive:true}));
window.addEventListener('scroll',activity,{passive:true,capture:true});

/* ---------- actions ---------- */
const A={
go(t){S.tab=t;render();window.scrollTo(0,0)},
async tryApp(){const v=document.getElementById('apppin').value;try{const d=await decryptData(v);initData(d);S.unlocked=true;S.pinErr=false;PASS=v;LASTSYNC=new Date()}catch(e){S.pinErr=true}render()},
refreshData(){checkUpdate(true)},
askQ(){const el=document.getElementById('askin');if(!el||!el.value.trim())return;const v=el.value.trim();
 ASKLOG.push({q:v,a:answerQuery(v)});render();
 const box=document.getElementById('asklog');if(box)box.scrollTop=box.scrollHeight;
 const inp=document.getElementById('askin');if(inp){inp.value='';inp.focus()}},
askChip(v){const inp=document.getElementById('askin');if(inp){inp.value=v;A.askQ()}},
tryBhup(){const v=document.getElementById('bpin').value;if(v===BHUP_PIN){S.bhup=true;S.pinErr=false;S.modal='bhupnote'}else{S.pinErr=true}render()},
bhupBtn(){S.pinErr=false;S.modal=S.bhup?'bhupnote':'bhuppin';render()},
hideBhup(){S.bhup=false;render()},
modal(m){S.pinErr=false;S.modal=m;render()},
q(v){S.q=v;refreshView('qsearch')},
pSearch(v){S.pSearch=v;refreshView('psearch')},
pFrom(v){S.pFrom=v;refreshView()},
pTo(v){S.pTo=v;refreshView()},
stmt(id){if(hideB(id)){S.pinErr=false;S.modal='bhuppin'}else{S.stmtEmp=id;S.modal='statement'}render()},
typeF(v){S.typeF=v;render()},
statusF(v){S.statusF=v;render()},
openEmp(id){S.openEmp=S.openEmp===id?null:id;render()},
lEmp(v){S.lEmp=v;render()},
lMonth(v){S.lMonth=v;render()},
lType(v){S.lType=v;render()},
viewTx(id){S.lEmp=id;S.tab='ledger';render()},
md(mk,f){S.monthDetail=(S.monthDetail&&S.monthDetail.mk===mk&&S.monthDetail.filter===f)?null:{mk,filter:f};render()},
};

function insights(){
const inrC=v=>Math.abs(v)>=100000?'₹'+(v/100000).toFixed(1)+'L':Math.abs(v)>=1000?'₹'+Math.round(v/1000)+'k':'₹'+Math.round(v);
/* 1) Net balance trend */
const maxC=Math.max(...MONTHLY.map(m=>Math.abs(m.close)),1);
const trend=MONTHLY.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">
 <div style="font-size:10px;color:var(--sub);font-weight:700">${inrC(m.close)}</div>
 <div style="width:100%;max-width:34px;height:${Math.max((Math.abs(m.close)/maxC)*95,4)}px;background:${m.close>=0?'var(--red)':'var(--green)'};opacity:.85;border-radius:6px 6px 0 0;align-self:center"></div>
 <div style="font-size:10.5px;color:var(--sub);font-weight:600">${mlabel(m.mk).split(' ')[0]}</div></div>`).join('');
/* 2) Paid YTD per person */
const prs=DATA.employees.map(e=>({e,p:STATS[e.id].paid})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
const maxP=Math.max(...prs.map(x=>x.p),1);
const bars=prs.map(({e,p})=>hideB(e.id)
 ?`<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><div style="width:110px;font-size:12.5px;font-weight:600;flex-shrink:0">${esc(e.name.split(' ')[0])}</div>${lockBadge}</div>`
 :`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
 <div style="width:110px;font-size:12.5px;font-weight:600;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.name.split(' ')[0])}</div>
 <div style="flex:1;background:var(--chip);border-radius:6px;height:16px;overflow:hidden"><div style="width:${(p/maxP)*100}%;height:100%;background:var(--primary);border-radius:6px"></div></div>
 <div style="width:72px;text-align:right;font-size:12.5px;font-weight:700">${inrC(p)}</div></div>`).join('');
/* 3) Recurring: Claude AI */
const ai=DATA.ledger.filter(t=>/claude/i.test(t.desc||'')&&t.direction==='+');
const aiTot=ai.reduce((s,t)=>s+t.amount,0);
const aiRows=ai.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="trow" style="padding:8px 4px"><div style="width:80px;font-size:12px;color:var(--sub)">${fdate(t.date)}</div><div style="flex:1;font-size:12.5px">${esc(t.desc)}</div><div style="font-weight:700;font-size:12.5px">${inr(t.amount)}</div></div>`).join('');
/* 4) Projections & flags */
const pri=STATS['FRPK511'].bal;
const priM=Math.max(1,Math.round(pri/18000));
const priLast=pri-(priM-1)*18000;
const julMap={};DATA.ledger.forEach(t=>{if(t.month!=='2026-07')return;julMap[t.empId]=julMap[t.empId]||0;julMap[t.empId]+=t.direction==='-'?-t.amount:t.amount});
let julVis=0,julHasB=false;
const julRows=Object.entries(julMap).filter(([,v])=>Math.round(v)>0).map(([id,v])=>{
 const nm=(DATA.employees.find(e=>e.id===id)||{}).name||id;
 if(hideB(id)){julHasB=true;return `<div style="display:flex;padding:5px 0;font-size:13px"><span style="flex:1">${esc(nm)}</span>${lockBadge}</div>`}
 julVis+=v;return `<div style="display:flex;padding:5px 0;font-size:13px"><span style="flex:1">${esc(nm)}</span><b style="color:var(--red)">${inr(v)}</b></div>`}).join('');
const avgPaid=DATA.employees.reduce((s,e)=>s+STATS[e.id].paid,0)/MONTHLY.filter(m=>m.paid>0).length;
const hariom=STATS['FRHK612'].bal;
return `
<div class="card" style="margin-top:0"><div class="ctitle disp">Net Balance Trend <span class="note" style="font-weight:400">(month-end pe company ko kitna dena baaki)</span></div>
 <div style="display:flex;gap:6px;align-items:flex-end;padding:0 2px">${trend}</div>
 <div class="note" style="margin-top:10px">Laal = staff ko dena hai. Jitna upar, utna zyada due. July mein jump = July salaries abhi due hain.</div></div>
<div class="card"><div class="ctitle disp">Paid YTD — kis pe kitna gaya</div>${bars}</div>
<div class="card"><div class="ctitle disp">Recurring — Claude AI Subscription</div>

  <span style="font-size:13px;font-weight:600">Ab tak total (Harshit ke through)</span>
  <span class="disp" style="margin-left:auto;font-weight:800;font-size:19px;color:var(--blue)">${inr(aiTot)}</span></div>
 ${aiRows}
 <div class="note" style="margin-top:8px">Har month ~₹2,250–2,350 aata hai — budget mein permanent maan ke chalo.</div></div>
<div class="card"><div class="ctitle disp">Projections & Flags</div>
 <div style="background:var(--greenSoft);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13px">
  <b>Priyanka settlement:</b> due ${inr(pri)} — ₹18,000/month ke hisaab se <b>~${priM} months</b> mein settle (last installment ${inr(priLast)}).</div>
 <div style="background:var(--redSoft);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13px">
  <b>July salary due (carry to next month):</b>${julRows}
  <div style="display:flex;padding:6px 0 0;border-top:1px solid rgba(0,0,0,.08);margin-top:4px;font-size:13px"><span style="flex:1"><b>Total</b></span><b>${inr(julVis)}${julHasB?' + 🔒':''}</b></div></div>
 <div style="background:var(--panelAlt);border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13px">

   <span style="width:6px;height:24px;border-radius:6px;background:var(--primary);flex-shrink:0"></span>
   <span style="flex:1;font-size:13.5px">${esc(r.label)}</span>
   <span style="font-weight:700;color:var(--primary);white-space:nowrap">${inr(r.amount)}</span></div>`).join('')}
  <div style="display:flex;padding:10px 13px;background:var(--panelAlt);font-weight:700"><span style="flex:1">Total aaya</span><span style="color:var(--primary)">${inr(rec)}</span></div>
 </div>
 ${(n.fronted&&n.fronted.length)?`<div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);font-weight:700;margin-bottom:8px">Maine company ke liye diya (reimburse hona hai)</div>
 <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:15px">
  ${n.fronted.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)">
   <span style="width:6px;height:24px;border-radius:6px;background:var(--red);flex-shrink:0"></span>
   <span style="flex:1;font-size:13.5px">${esc(r.label)}</span>
   <span style="font-weight:700;color:var(--red);white-space:nowrap">+${inr(r.amount)}</span></div>`).join('')}
 </div>`:''}
 <div style="background:${pend>0?'var(--redSoft)':'var(--greenSoft)'};border-radius:14px;padding:15px 17px;display:flex;align-items:center">
  <div><div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:${pend>0?'var(--red)':'var(--green)'};font-weight:700">Pending</div>
  <div class="note" style="margin-top:2px">${(n.fronted&&n.fronted.length)?'Salary + maine diya − jo aaya':'Salary − jo aaya'}</div></div>
  <span class="disp" style="margin-left:auto;font-weight:800;font-size:25px;color:${pend>0?'var(--red)':'var(--green)'}">${inr(pend)}</span></div>
 ${(n.memos&&n.memos.length)?`<div style="margin-top:15px">
  <div style="font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);font-weight:700;margin-bottom:8px">Alag items (kisi total me nahi)</div>
  <div style="background:var(--panelAlt);border:1px dashed var(--line);border-radius:12px;overflow:hidden">
  ${n.memos.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)">
   <span style="flex:1;font-size:13px;color:var(--sub)">${esc(r.label)}</span>
   <span style="font-weight:700;color:var(--sub);white-space:nowrap">${inr(r.amount)}</span></div>`).join('')}</div></div>`:''}
</div></div>`}

/* ---------- root render ---------- */
function render(){
const app=document.getElementById('app');
const y=window.scrollY||document.documentElement.scrollTop||0;
if(!S.unlocked){app.innerHTML=lockScreen();const p=document.getElementById('apppin');if(p)p.focus();armTimers();return}
let modal='';
if(S.modal==='rules')modal=rulesModal();
else if(S.modal==='ask')modal=askModal();
else if(S.modal==='bhuppin')modal=bhupPinModal();
else if(S.modal==='bhupnote')modal=bhupNoteModal();
else if(S.modal==='statement')modal=stmtModal();
app.innerHTML=header()+`<div class="wrap" id="view">${view()}</div>
<div class="footer">Read-only viewer · ${VERSION} · Data as of ${asOfStr()} · Audit-verified ✓<br>Update Claude ko chat mein batao — push hote hi tracker khud update ho jayega (har minute auto-check + ⟳ button).</div>`+modal;
window.scrollTo(0,y);
if(S.modal==='bhuppin'){const p=document.getElementById('bpin');if(p)p.focus()}
if(S.modal==='ask'){const p=document.getElementById('askin');if(p)p.focus();const b=document.getElementById('asklog');if(b)b.scrollTop=b.scrollHeight}
armTimers()}
function view(){return S.tab==='dashboard'?dashboard():S.tab==='staff'?staff():S.tab==='ledger'?ledgerView():S.tab==='upcoming'?upcoming():S.tab==='insights'?insights():monthlyView()}
function refreshView(focusId){const v=document.getElementById('view');if(!v)return render();
v.innerHTML=view();
if(focusId){const el=document.getElementById(focusId);if(el){el.focus();const l=(el.value||'').length;try{el.setSelectionRange(l,l)}catch(e){}}}
armTimers()}
render();
</script>
